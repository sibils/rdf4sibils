# Same public routes as nginx-rdf4sibils.conf, with QLever behind /sparql.
#
# Differences with the Virtuoso config:
# - QLever already sends Access-Control-Allow-Origin, adding it here would duplicate it
#   and browsers reject a duplicated header
# - QLever has no HTML page of its own under /sparql, so a browser opening /sparql
#   without a query goes to the SPARQL editor
# - QLever ignores the request path, the upstream URL only has to end with /
# - the /sparql location is an exact match, so /sparql-service and /sparql-editor
#   reach FastAPI through location / and need no location of their own

map "$request_method:$args" $sparql_open_in_browser {
    default 0;
    "GET:"  1;
}

server {
    listen 80;
    server_name _;

    # route to fastapi service
    location / {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # route to internal SPARQL service
    location = /sparql {
        if ($sparql_open_in_browser) {
            return 302 /sparql-editor;
        }
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_read_timeout 1800s;
        proxy_pass http://localhost:7019/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
